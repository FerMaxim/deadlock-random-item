<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Deadlock Build Randomizer Test</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #121212; color: #eee; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: #1e1e1e; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        h1 { text-align: center; color: #ff4757; margin-bottom: 30px; }
        
        .control-panel { margin-bottom: 20px; padding: 20px; background: #2a2a2a; border-radius: 8px; }
        
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: bold; margin-bottom: 8px; color: #aaa; }
        select { width: 100%; padding: 10px; background: #333; color: white; border: 1px solid #444; border-radius: 4px; font-size: 1.1em; }
        
        .slider-container { margin: 20px 0; position: relative; }
        input[type=range] { width: 100%; cursor: pointer; }
        
        #preset-name { font-size: 1.2em; font-weight: bold; margin-bottom: 5px; }
        #preset-desc { font-size: 0.9em; color: #aaa; margin-bottom: 15px; min-height: 40px; }
        
        .btn { display: block; width: 100%; padding: 15px; background: #ff4757; color: white; border: none; border-radius: 4px; font-size: 1.1em; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn:hover { background: #ff6b81; }
        .btn:disabled { background: #555; cursor: not-allowed; }
        
        .results { display: flex; gap: 20px; margin-top: 20px; }
        .col { flex: 1; background: #2a2a2a; padding: 15px; border-radius: 8px; }
        .col h3 { margin-top: 0; border-bottom: 2px solid #ff4757; padding-bottom: 10px; }
        
        .item-row { display: flex; justify-content: space-between; padding: 8px; border-bottom: 1px solid #333; }
        .item-row:last-child { border-bottom: none; }
        .cost { color: #2ed573; font-weight: bold; }
    </style>
</head>
<body>

<div class="container" id="app-container">
    <h1>Генератор Билдов</h1>
    
    <div class="control-panel">
        <div class="form-group">
            <label for="hero-select">Выберите героя:</label>
            <select id="hero-select">
                <option value="1">Infernus</option>
                <option value="2">Seven</option>
                <option value="3">Vindicta</option>
                <option value="4">Lady geist</option>
                <option value="6">Abrams</option>
                <option value="7">Wraith</option>
                <option value="8">Mcginnis</option>
                <option value="10">Paradox</option>
                <option value="11">Dynamo</option>
                <option value="12">Kelvin</option>
                <option value="13">Haze</option>
                <option value="14">Holliday</option>
                <option value="15" selected>Bebop</option>
                <option value="16">Calico</option>
                <option value="17">Grey talon</option>
                <option value="18">Mo & krill</option>
                <option value="19">Shiv</option>
                <option value="20">Ivy</option>
                <option value="21">Kali</option>
                <option value="25">Warden</option>
                <option value="27">Yamato</option>
                <option value="31">Lash</option>
                <option value="35">Viscous</option>
                <option value="39">The boss</option>
                <option value="47">Tokamak</option>
                <option value="48">Wrecker</option>
                <option value="49">Rutger</option>
                <option value="50">Pocket</option>
                <option value="51">Thumper</option>
                <option value="52">Mirage</option>
                <option value="54">Cadence</option>
                <option value="56">Bomber</option>
                <option value="57">Shield guy</option>
                <option value="58">Vyper</option>
                <option value="59">Vandal</option>
                <option value="60">Sinclair</option>
                <option value="61">Trapper</option>
                <option value="63">Mina</option>
            </select>
        </div>

        <div class="form-group" style="margin-top: 30px;">
            <div id="preset-name" style="color: #3498db;">Мета (Уровень 1)</div>
            <div id="preset-desc">Киберспортивный билд без случайностей.</div>
            
            <div class="slider-container">
                <input type="range" id="temp-slider" min="1" max="5" value="1" step="1">
                <div style="display: flex; justify-content: space-between; font-size: 0.8em; color: #777; margin-top: 5px;">
                    <span>Мета</span>
                    <span>Разнообразие</span>
                    <span>Адекватный</span>
                    <span>Фановый</span>
                    <span>Безумие</span>
                </div>
            </div>
        </div>
        
        <button class="btn" id="generate-btn">Сгенерировать билд</button>
    </div>
    
    <div class="results" id="results" style="display: none;">
        <div style="width: 100%; text-align: center; font-size: 1.2em; color: #34db98; margin-bottom: 10px;" id="archetype-info"></div>
        <div style="display: flex; gap: 20px; width: 100%;">
            <div class="col">
                <h3>Порядок способностей</h3>
                <div id="abilities-list"></div>
            </div>
            <div class="col">
                <h3>Финальный Инвентарь (24 шт.)</h3>
                <div id="items-list"></div>
            </div>
        </div>
    </div>
</div>

<script>
    const presets = [
        { name: "Мета", desc: "Киберспортивный билд без случайностей.", temp: 0.1, chaos: false, color: "#3498db" },
        { name: "Разнообразие", desc: "Рабочий билд с небольшими вариациями из топ-предметов.", temp: 1.0, chaos: false, color: "#2ecc71" },
        { name: "Адекватный рандом", desc: "Полноценное разнообразие, нестандартные прокачки.", temp: 2.0, chaos: false, color: "#f1c40f" },
        { name: "Фановый хаос", desc: "Случайные эксперименты (например, Мили-сборки).", temp: 5.0, chaos: true, color: "#e67e22" },
        { name: "Полное безумие", desc: "100% рандом из всего магазина. Законы логики больше не работают.", temp: 15.0, chaos: true, color: "#e74c3c" }
    ];

    const slider = document.getElementById('temp-slider');
    const heroSelect = document.getElementById('hero-select');
    const presetName = document.getElementById('preset-name');
    const presetDesc = document.getElementById('preset-desc');
    const btn = document.getElementById('generate-btn');

    slider.addEventListener('input', (e) => {
        const val = parseInt(e.target.value) - 1;
        const preset = presets[val];
        presetName.textContent = `${preset.name} (Уровень ${val + 1})`;
        presetName.style.color = preset.color;
        presetDesc.textContent = preset.desc;
    });

    btn.addEventListener('click', async () => {
        const val = parseInt(slider.value) - 1;
        const preset = presets[val];
        const heroId = heroSelect.value;
        const heroName = heroSelect.options[heroSelect.selectedIndex].text;
        
        btn.disabled = true;
        btn.textContent = 'Генерация (Нейросеть думает...)';
        
        try {
            const res = await fetch(`/api/generate?hero_id=${heroId}&archetype=random&temperature=${preset.temp}`);
            const data = await res.json();
            
            if (data.status === 'success') {
                document.getElementById('results').style.display = 'block';
                document.getElementById('archetype-info').textContent = `Сгенерировано для ${heroName} — Архетип: ${data.archetype}`;
                
                // Рендер абилок
                const abList = document.getElementById('abilities-list');
                abList.innerHTML = '';
                data.abilities.forEach((ab, i) => {
                    const action = ab.level_reached === 1 ? 'ОТКРЫТИЕ' : `УЛУЧШЕНИЕ (T${ab.level_reached - 1})`;
                    abList.innerHTML += `<div class="item-row">
                        <span>${i+1}. ${action}</span>
                        <span style="color: #f39c12">${ab.name}</span>
                    </div>`;
                });
                
                // Рендер предметов
                const itList = document.getElementById('items-list');
                itList.innerHTML = '';
                data.items.forEach(it => {
                    itList.innerHTML += `<div class="item-row">
                        <span>${it.name}</span>
                        <span class="cost">${it.cost} душ</span>
                    </div>`;
                });
            } else {
                alert('Ошибка: ' + data.message);
            }
        } catch (e) {
            alert('Сетевая ошибка: ' + e);
        } finally {
            btn.disabled = false;
            btn.textContent = 'Сгенерировать билд';
        }
    });
</script>
</body>
</html>
