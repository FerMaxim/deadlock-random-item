{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEADLOCK ML GENERATOR</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Inter:wght@400;600;800&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>
    <div class="background-effects">
        <div class="blob weapon-blob"></div>
        <div class="blob vitality-blob"></div>
        <div class="blob spirit-blob"></div>
    </div>
    <div class="grain-overlay"></div>

    <main class="container">
        <header class="app-header">
            <div class="header-title">
                <h1 class="glitch" data-text="DEADLOCK">DEADLOCK</h1>
                <p class="subtitle">AI Build Generator</p>
            </div>
            
            <div class="party-panel panel-glass" id="partyPanel">
                <div id="partyControlsInputs" class="party-inputs">
                    <input type="text" id="nicknameInput" placeholder="Nickname" class="custom-input">
                    <button id="createRoomBtn" class="custom-btn btn-spirit">CREATE ROOM</button>
                    <div class="join-group">
                        <input type="text" id="roomCodeInput" placeholder="Code" class="custom-input room-code-input">
                        <button id="joinRoomBtn" class="custom-btn">JOIN</button>
                    </div>
                </div>
                
                <div id="roomInfo" class="room-info" style="display: none;">
                    <div class="room-details">
                        <span class="room-label">ROOM:</span>
                        <strong id="currentRoomCode" class="room-code"></strong>
                        <span class="room-label" style="margin-left: 15px;">USER:</span>
                        <strong id="currentNickname" class="room-nick"></strong>
                    </div>
                    <button id="leaveRoomBtn" class="custom-btn btn-vitality">LEAVE ROOM</button>
                </div>
            </div>
        </header>

        <div class="game-layout">
            <!-- Left Players Column -->
            <div class="players-column" id="playersLeft">
            </div>
            
            <!-- Center Column -->
            <div class="center-column">
                
                <!-- Controls Middle -->
                <section class="controls panel-glass">
                    <div class="hero-selection-area">
                        <h3 class="panel-title">SELECT HERO</h3>
                        <div class="hero-grid" id="heroGrid">
                            <!-- JS Will Inject Heroes -->
                        </div>
                    </div>

                    <div class="temp-wrap" style="margin-top:20px;">
                        <div class="temp-label-row">
                            <label class="filter-label">TEMPERATURE</label>
                            <span id="tempLabel" class="temp-badge temp-meta">META</span>
                        </div>
                        <div class="temp-track-wrap">
                            <span class="temp-icon">🧊</span>
                            <input type="range" id="tempSlider" class="temp-slider" min="1" max="5" step="1" value="2">
                            <span class="temp-icon">🔥</span>
                        </div>
                        <div class="temp-pips">
                            <span class="pip active" data-t="1">1</span>
                            <span class="pip active" data-t="2">2</span>
                            <span class="pip" data-t="3">3</span>
                            <span class="pip" data-t="4">4</span>
                            <span class="pip" data-t="5">5</span>
                        </div>
                    </div>

                    <button id="generateBuildBtn" class="btn-roll btn-build" style="margin-top:20px; width:100%;">
                        <span class="roll-text">GENERATE BUILD</span>
                        <span class="shimmer"></span>
                    </button>
                </section>


                <section class="controls panel-glass" style="margin-top: 15px; min-height: 120px;">
                    <h3 class="panel-title" style="margin-bottom: 10px;">ABILITY PROGRESSION</h3>
                    <div id="abilityPath" class="ability-timeline">
                        <div style="color: #666; font-family: var(--font-body); font-style: italic;">AWAITING INPUT...</div>
                    </div>
                </section>

                <!-- History -->
                <section class="my-history panel-glass" style="margin-top: 15px;">
                    <div class="history-header">
                        <h3>MY HISTORY</h3>
                        <button id="newGameBtn" class="custom-btn btn-reset">&#x21bb; RESET</button>
                    </div>
                    <div class="history-list" id="historyList">
                    </div>
                </section>

            </div>
            
            <!-- Right Players Column -->
            <div class="players-column" id="playersRight">
            </div>
        </div>
    </main>

    <script>
        const INITIAL_ROOM_CODE = "{{ room_code|default:'' }}";
    </script>
    <script src="{% static 'js/app.js' %}"></script>
</body>
</html>
